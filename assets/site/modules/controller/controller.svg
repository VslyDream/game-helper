<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435" class="controller-picture" role="img" aria-label="Контроллер: кнопки подсвечиваются, стики перемещаются при вводе">
<defs><linearGradient id="body" x2="0" y2="1"><stop stop-color="#34475a"/><stop offset="1" stop-color="#1b2a3a"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
